<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card text-center shadow">
        <div class="card-body p-5">
          <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
          <h2 class="mt-3">¡Pago exitoso!</h2>
          <p class="text-muted">
            Tu reserva fue confirmada. En breve vas a poder descargar tu comprobante.
          </p>
          <p *ngIf="paymentId" class="small text-muted">
            N° de operación: {{ paymentId }}
          </p>
          <div class="d-grid gap-2 mt-4">
            <a routerLink="/cliente/reservas" class="btn btn-primary">Ver mis reservas</a>
            <a routerLink="/" class="btn btn-outline-secondary">Volver al inicio</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
