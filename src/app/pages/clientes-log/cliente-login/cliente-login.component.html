<div class="login-page m-auto">
  <div class="card login-card shadow-sm">
    <div class="card-body p-4">
      <h2 class="card-title mb-2">Iniciar sesión</h2>
      <p class="login-subtitle mb-4">
        Ingresá con tu cuenta para acceder al sistema.
      </p>

      <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label" for="correoElectronico">
            Correo electrónico
          </label>

          <input type="email" class="form-control" id="correoElectronico" name="correoElectronico" required
            [(ngModel)]="loginModel.correoElectronico" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="clave">
            Contraseña
          </label>

          <input type="password" class="form-control" id="clave" name="clave" required [(ngModel)]="loginModel.clave" />
          @if (mostrarTextoError) {
          <span class="text-danger">{{ textoError }}</span>
          }
        </div>


        <button type="submit" class="btn btn-primary w-100" [disabled]="!loginForm.form.valid">
          Ingresar
        </button>
      </form>

      <p class="mt-3 mb-3 text-center">
        ¿No tenés cuenta?
        <a routerLink="/auth/signup">Crear cuenta</a>
      </p>

      <div class="divisor mb-3">
        <span class="px-2">o</span>
      </div>

      <div #googleBtn></div>
    </div>
  </div>
</div>
