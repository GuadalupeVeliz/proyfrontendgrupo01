<div class="auth-page m-auto py-3">
  <div class="card auth-card auth-card--admin shadow-sm">
    <div class="card-body p-4 p-md-5">

      <p class="auth-eyebrow mb-1">Panel del gerente</p>
      <h3 class="card-title mb-2">Registrar usuario</h3>
      <p class="auth-subtitle mb-4">
        Creá una cuenta de cliente o de empleado.
      </p>

      <form #signupForm="ngForm" (ngSubmit)="onSubmit()">

        <div class="mb-3">
          <label class="form-label" for="tipo">Tipo de usuario</label>
          <select class="form-select" id="tipo" name="tipo" required [(ngModel)]="tipoDeUsuarioSeleccionado">
            @for (t of tiposDeUsuario; track $index) {
            <option [value]="t">{{ t | titlecase }}</option>
            }
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label" for="correoElectronico">Correo electrónico</label>
          <input type="email" class="form-control" id="correoElectronico" name="correoElectronico" autocomplete="off"
            required [(ngModel)]="signupModel.correoElectronico" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="clave">Contraseña</label>
          <input type="password" class="form-control" id="clave" name="clave" autocomplete="new-password" required
            [(ngModel)]="signupModel.clave" />
        </div>

        <fieldset class="auth-fieldset mt-4 mb-4">
          @if (tipoDeUsuarioSeleccionado === 'cliente') {
          <legend class="auth-legend">Datos del cliente</legend>
          <div class="mb-3">
            <label class="form-label" for="dni">DNI</label>
            <input type="text" class="form-control" id="dni" name="dni" inputmode="numeric" required
              [(ngModel)]="signupModel.dni" />
          </div>
          <div class="mb-3">
            <label class="form-label" for="nombreCompleto">Nombre completo</label>
            <input type="text" class="form-control" id="nombreCompleto" name="nombreCompleto" required
              [(ngModel)]="signupModel.nombreCompleto" />
          </div>
          <div class="mb-2">
            <label class="form-label" for="telefono">Teléfono</label>
            <input type="tel" class="form-control" id="telefono" name="telefono" required
              [(ngModel)]="signupModel.telefono" />
          </div>
          } @else {
          <legend class="auth-legend">Datos del empleado</legend>
          <div class="mb-3">
            <label class="form-label" for="legajo">Legajo</label>
            <input type="text" class="form-control" id="legajo" name="legajo" required
              [(ngModel)]="signupModel.legajo" />
          </div>
          <div class="mb-3">
            <label class="form-label" for="sede">Sede</label>
            <select class="form-select" id="sede" name="sede" required [(ngModel)]="signupModel.sede">
              @for (s of sedes; track $index) {
              <option [value]="s">{{ s | titlecase }}</option>
              }
            </select>
          </div>
          <div class="form-check form-switch mb-2">
            <input class="form-check-input" type="checkbox" role="switch" id="esGerente" name="esGerente"
              [(ngModel)]="signupModel.esGerente" />
            <label class="form-check-label" for="esGerente">Es gerente</label>
          </div>
          }
        </fieldset>

        @if (cartelUsuarioRegistrado) {
        <div class="alert alert-success py-2" role="alert">
          Usuario registrado con éxito
        </div>
        }
        @if (cartelErrorAlRegistrar) {
        <div class="alert alert-danger py-2" role="alert">
          {{ mensajeError }}
        </div>
        }

        <button type="submit" class="btn btn-dark w-100" [disabled]="!signupForm.form.valid || cargando">
          @if (cargando) {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
          }
          Registrar usuario
        </button>

      </form>
    </div>
  </div>
</div>
