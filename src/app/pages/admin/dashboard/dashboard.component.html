<section class="admin-dashboard py-5">
  <div class="container">
    <div class="admin-header text-center mb-5">
      <h1 class="admin-title">
        Administración
      </h1>

      <p class="admin-subtitle">
        Bienvenido al Panel de Administración. Seleccione el módulo que desea administrar.
      </p>

      @if (rol === 'Gerente') {
        <span class="admin-badge">
          Acceso completo habilitado
        </span>
      } @else {
        <span class="admin-badge">
          Acceso a módulos operativos
        </span>
      }
    </div>

    <div class="row g-4 justify-content-center">
      @for (modulo of modulosVisibles; track modulo.ruta) {
        <div class="col-12 col-md-6 col-lg-4">
          <a
            class="admin-card"
            [routerLink]="modulo.ruta"
          >
            <div class="admin-card-icon">
              <i [class]="modulo.icono"></i>
            </div>

            <h5 class="admin-card-title">
              {{ modulo.titulo }}
            </h5>

            <p class="admin-card-description">
              {{ modulo.descripcion }}
            </p>
          </a>
        </div>
      }
    </div>
  </div>
</section>
