<div class="container py-3">
  <form #signupForm="ngForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="tipo">Tipo de usuario</label>
      <select class="form-control" id="tipo" required [(ngModel)]="tipoDeUsuarioSeleccionado" name="tipo">
        @for (t of tiposDeUsuario; track $index) {
          <option [value]="t">{{ t | titlecase }}</option>
        }
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label" for="correoElectronico">Correo electrónico</label>
      <input
        type="email"
        class="form-control"
        id="correoElectronico"
        required
        [(ngModel)]="signupModel.correoElectronico"
        name="correoElectronico"
      />
    </div>

    <div class="mb-3">
      <label class="form-label" for="clave">Contraseña</label>
      <input type="password" class="form-control" id="clave" required [(ngModel)]="signupModel.clave" name="clave" />
    </div>

    <fieldset>
      @if (tipoDeUsuarioSeleccionado === 'cliente') {
        <legend>Cliente</legend>
        <div class="mb-3">
          <label class="form-label" for="dni">DNI</label>
          <input type="text" class="form-control" id="dni" required [(ngModel)]="signupModel.dni" name="dni" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="nombreCompleto">Nombre completo</label>
          <input
            type="text"
            class="form-control"
            id="nombreCompleto"
            required
            [(ngModel)]="signupModel.nombreCompleto"
            name="nombreCompleto"
          />
        </div>
        <div class="mb-3">
          <label class="form-label" for="telefono">Telefono</label>
          <input
            type="text"
            class="form-control"
            id="telefono"
            required
            [(ngModel)]="signupModel.telefono"
            name="telefono"
          />
        </div>
      } @else {
        <legend>Empleado</legend>
        <div class="mb-3">
          <label class="form-label" for="legajo">Legajo</label>
          <input type="text" class="form-control" id="legajo" required [(ngModel)]="signupModel.legajo" name="legajo" />
        </div>
        <div class="mb-3">
          <label for="sede">Sede</label>
          <select class="form-control" id="sede" required [(ngModel)]="signupModel.sede" name="sede">
            @for (s of sedes; track $index) {
              <option [value]="s">{{ s | titlecase }}</option>
            }
          </select>
        </div>
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" role="switch" id="esGerente" />
          <label class="form-check-label" for="esGerente">Gerente</label>
        </div>
      }
    </fieldset>

    <button type="submit" class="btn btn-success" [disabled]="!signupForm.form.valid">Registrar</button>
  </form>
</div>
